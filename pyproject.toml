[project]
name = "fundamentals-news-trader"
version = "0.1.0"
description = "Investing bot that screens US equities on fundamentals (SEC EDGAR), reacts to news (Stock Titan), and trades via the Robinhood MCP."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.100",
    "apscheduler>=3.10,<4",
    "typer>=0.12",
    "rich>=13.7",
    "mcp>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bot = "bot.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
